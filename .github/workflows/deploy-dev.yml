name: Deploy to Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for dev
        run: npm run build:dev

      - name: Deploy to Firebase Hosting (dev)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BARTERR_DEV }}' > /tmp/firebase-sa.json
          npm install -g firebase-tools
          firebase deploy --only hosting --project barterr-dev-98dfd --non-interactive
