<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>New message on Barterr</title>
<!--[if mso]><style>body,table,td{font-family:Arial,Helvetica,sans-serif !important;}</style><![endif]-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Montserrat:wght@800;900&display=swap");
  body { margin: 0; padding: 0; background: #efeff4; -webkit-font-smoothing: antialiased; }
  table { border-collapse: collapse; }
  a { text-decoration: none; }
  .btn:hover { opacity: .92; }
  @media (max-width: 620px) { .container { width: 100% !important; } .px { padding-left: 24px !important; padding-right: 24px !important; } }
</style>
</head>
<body>
<!-- Variables: recipientName, senderName, message, tradeUrl -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{senderName}} sent you a message about your trade.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#efeff4;">
  <tr><td align="center" style="padding:32px 12px;">
    <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">

      <!-- Header -->
      <tr><td style="padding:28px 40px;border-bottom:1px solid #e5e5ea;" class="px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
          <td align="left"><img src="https://firebasestorage.googleapis.com/v0/b/barterr-dev-98dfd.firebasestorage.app/o/public%2Fbarterr-logo%20(1).png?alt=media&token=9a1ede0a-0748-40b1-abc9-ab5c00797931" width="120" height="30" alt="Barterr" style="display:block;border:0;vertical-align:middle;"></td>
          <td align="right" style="font-family:'Montserrat',Arial,sans-serif;font-weight:900;font-size:18px;color:#000;">Barterr</td>
        </tr></table>
      </td></tr>

      <!-- Title -->
      <tr><td style="padding:36px 40px 8px;" class="px">
        <p style="margin:0 0 6px;font-family:'Karla',Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#3366ff;">New Message</p>
        <h1 style="margin:0 0 8px;font-family:'Montserrat',Arial,sans-serif;font-weight:900;font-size:26px;line-height:1.15;color:#000;letter-spacing:-0.01em;">{{senderName}} messaged you</h1>
        <p style="margin:0;font-family:'Karla',Arial,sans-serif;font-size:16px;line-height:1.6;color:#333;">Hey {{recipientName}}, you have a new message about your trade.</p>
      </td></tr>

      <!-- Message card -->
      <tr><td style="padding:16px 40px 8px;" class="px">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border:1px solid #e5e5ea;border-left:4px solid #3366ff;border-radius:0 12px 12px 0;">
          <tr><td style="padding:16px 20px;">
            <p style="margin:0 0 6px;font-family:'Karla',Arial,sans-serif;font-size:12px;font-weight:700;color:#8e8e93;text-transform:uppercase;letter-spacing:.04em;">{{senderName}}</p>
            <p style="margin:0;font-family:'Karla',Arial,sans-serif;font-size:15px;line-height:1.6;color:#000;">{{message}}</p>
          </td></tr>
        </table>
      </td></tr>

      <!-- CTA -->
      <tr><td align="center" style="padding:24px 40px 8px;" class="px">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td align="center" bgcolor="#111827" style="border-radius:12px;">
            <a class="btn" href="{{tradeUrl}}" style="display:inline-block;padding:15px 32px;font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:16px;color:#ffffff;border-radius:12px;">Reply in App</a>
          </td>
        </tr></table>
      </td></tr>

      <!-- Footer -->
            <tr><td style="padding:0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#3366ff;background-image:linear-gradient(135deg,#33ff99 0%,#33c9bc 50%,#3366ff 100%);">
          <tr><td align="center" style="padding:28px 40px;">
            <p style="margin:0 0 4px;font-family:'Montserrat',Arial,sans-serif;font-weight:900;font-size:15px;letter-spacing:-0.3px;color:#ffffff;">Barterr</p>
            <p style="margin:0;font-family:'Karla',Arial,sans-serif;font-size:11px;color:rgba(255,255,255,0.8);">&copy; 2026 Barterr &nbsp;&middot;&nbsp; Trade sneakers with confidence.</p>
          </td></tr>
        </table>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
